name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # antx-monitor 快照：仅 2026-11-18 06:00–15:59 UTC（北京 14:00–23:59，覆盖认购窗口）每 5 分钟重建一次
  # GitHub 定时任务可能延迟；认购结束后提交最终 antx-monitor/snapshot.json 并删除此行
  schedule:
    - cron: '*/5 6-15 18 11 *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build.mjs
      - name: ANTx subscription snapshot
        run: node scripts/antx-snapshot.mjs _site/antx-monitor/snapshot.json
        continue-on-error: true
        timeout-minutes: 8
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
